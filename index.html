<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="Pointage Surface" />
    <meta name="application-name" content="Pointage Surface" />

    <meta name="description" content="Pointage Surface — Moteur d'inspection, facturation et export Excel." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pointage Surface</title>

    <script>
      // Self-Healing System for PWA chunk mismatch & stale Service Worker caches
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        if (
          msg.includes('Loading chunk') ||
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes('Unexpected token') ||
          msg.includes('is not a valid JavaScript MIME type')
        ) {
          console.warn('[PWA Self-Healing] Stale cache detected, purging and refreshing...', msg);
          if (!sessionStorage.getItem('pwa_auto_healed')) {
            sessionStorage.setItem('pwa_auto_healed', 'true');
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var name of names) caches.delete(name);
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var r of regs) r.unregister();
              });
            }
            setTimeout(function() {
              window.location.reload(true);
            }, 250);
          }
        }
      });
      window.addEventListener('load', function() {
        setTimeout(function() {
          sessionStorage.removeItem('pwa_auto_healed');
        }, 4000);
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="pwa-boot-screen" style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:#0c0d10; color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif; text-align:center; padding:24px; box-sizing:border-box;">
        <div style="width:72px; height:72px; border-radius:22px; background:linear-gradient(135deg, #10b981 0%, #059669 100%); display:flex; align-items:center; justify-content:center; box-shadow:0 12px 32px rgba(16,185,129,0.35); margin-bottom:20px; animation:pwa-pulse 2s infinite ease-in-out;">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div style="font-size:1.2rem; font-weight:700; letter-spacing:-0.02em; margin-bottom:6px; color:#ffffff;">Pointage Surface</div>
        <div style="font-size:0.85rem; color:#9ca3af; margin-bottom:24px;">Initialisation haute performance...</div>
        
        <div id="pwa-timeout-card" style="display:none; max-width:320px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:18px; padding:18px; backdrop-filter:blur(24px); box-shadow:0 10px 30px rgba(0,0,0,0.5);">
          <div style="font-size:0.88rem; font-weight:600; color:#e2e8f0; margin-bottom:6px;">Mise à jour en attente</div>
          <div style="font-size:0.78rem; color:#94a3b8; margin-bottom:14px;">Votre mobile utilise un ancien cache. Cliquez ci-dessous pour charger la version en direct.</div>
          <button onclick="if('caches' in window){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});});} if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});});} window.location.reload(true);" style="background:#10b981; color:#ffffff; border:none; border-radius:12px; padding:11px 20px; font-weight:700; font-size:0.85rem; cursor:pointer; width:100%; box-shadow:0 4px 14px rgba(16,185,129,0.4);">
            Actualiser l'application
          </button>
        </div>
      </div>
      <style>
        @keyframes pwa-pulse {
          0%, 100% { transform: scale(1); opacity: 0.95; }
          50% { transform: scale(1.06); opacity: 1; }
        }
      </style>
      <script>
        setTimeout(function() {
          var el = document.getElementById('pwa-timeout-card');
          if (el && document.getElementById('pwa-boot-screen')) {
            el.style.display = 'block';
          }
        }, 3500);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
