<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./pwa-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-title" content="Pointage Surface" />
    <meta name="application-name" content="Pointage Surface" />

    <meta name="description" content="Pointage Surface — Moteur d'inspection, facturation et export Excel." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pointage Surface</title>

    <script>
      // Early Theme Initialization to prevent theme flashing on boot
      (function() {
        try {
          var saved = localStorage.getItem('pointage_theme');
          var theme = (saved === 'dark' || saved === 'light')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>

    <script>
      // Self-Healing System for PWA chunk mismatch & stale Service Worker caches
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? String(e.message) : '';
        if (
          msg.includes('Loading chunk') ||
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes('Unexpected token') ||
          msg.includes('is not a valid JavaScript MIME type')
        ) {
          console.warn('[PWA Self-Healing] Stale cache detected, purging and refreshing...', msg);
          if (!sessionStorage.getItem('pwa_auto_healed')) {
            sessionStorage.setItem('pwa_auto_healed', 'true');
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var name of names) caches.delete(name);
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var r of regs) r.unregister();
              });
            }
            setTimeout(function() {
              window.location.reload(true);
            }, 250);
          }
        }
      });
      window.addEventListener('load', function() {
        setTimeout(function() {
          sessionStorage.removeItem('pwa_auto_healed');
        }, 4000);
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="pwa-boot-screen">
        <div class="boot-logo-container">
          <svg width="84" height="84" viewBox="78 46 380 380" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bootPBody" x1="15%" y1="10%" x2="85%" y2="90%">
                <stop offset="0%" stop-color="#323642" />
                <stop offset="50%" stop-color="#20232c" />
                <stop offset="100%" stop-color="#14151b" />
              </linearGradient>
              <linearGradient id="bootPJade" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4ade80" />
                <stop offset="100%" stop-color="#10b981" />
              </linearGradient>
              <linearGradient id="bootPCurl" x1="10%" y1="10%" x2="90%" y2="90%">
                <stop offset="0%" stop-color="#6ee7b7" />
                <stop offset="45%" stop-color="#34d399" />
                <stop offset="100%" stop-color="#0f766e" />
              </linearGradient>
              <filter id="bootPCurlShadow" x="-25%" y="-25%" width="150%" height="150%">
                <feDropShadow dx="-3" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
              </filter>
              <filter id="bootLogoGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.25" />
              </filter>
            </defs>

            <g filter="url(#bootLogoGlow)">
              <!-- Outer 'P' Letter Frame with Specular Contrast Rim -->
              <path
                d="M 160 416 C 114 416 88 390 88 344 L 88 168 C 88 96 136 56 220 56 L 320 56 C 408 56 456 104 456 192 L 456 244 C 456 332 408 380 320 380 L 264 380 C 258 380 252 384 250 390 C 244 406 236 416 216 416 Z"
                fill="url(#bootPBody)"
                stroke="rgba(255, 255, 255, 0.28)"
                stroke-width="10"
                stroke-linejoin="round"
              />

              <!-- Inner White Paper Document -->
              <path
                d="M 160 416 L 160 178 C 160 138 184 114 224 114 L 324 114 C 348 114 366 132 366 156 L 366 266 C 366 278 358 296 344 314 L 254 410 C 248 416 238 416 230 416 Z"
                fill="#FFFFFF"
              />

              <!-- Text Lines on Document -->
              <rect x="200" y="192" width="112" height="22" rx="11" fill="#1b1e26" />
              <rect x="200" y="234" width="62" height="22" rx="11" fill="url(#bootPJade)" />

              <!-- Folded Corner (Curl / Peel) -->
              <path
                d="M 366 266 C 366 312 338 350 286 372 C 264 382 246 398 234 416 C 248 382 278 350 316 332 C 346 320 362 296 366 266 Z"
                fill="url(#bootPCurl)"
                filter="url(#bootPCurlShadow)"
              />
            </g>
          </svg>
        </div>

        <div class="boot-title">Pointage Surface</div>
        <div class="boot-subtitle">Initialisation en cours...</div>

        <!-- Apple-style Indeterminate Shimmer Progress Bar -->
        <div class="boot-progress-track">
          <div class="boot-progress-indicator"></div>
        </div>
        
        <div id="pwa-timeout-card">
          <div class="pwa-timeout-title">Mise à jour en attente</div>
          <div class="pwa-timeout-desc">Votre mobile utilise un ancien cache. Cliquez ci-dessous pour charger la version en direct.</div>
          <button onclick="if('caches' in window){caches.keys().then(function(k){k.forEach(function(c){caches.delete(c);});});} if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister();});});} window.location.reload(true);" class="pwa-timeout-btn">
            Actualiser l'application
          </button>
        </div>
      </div>
      <style>
        #pwa-boot-screen {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          min-height: 100dvh;
          text-align: center;
          padding: 24px;
          box-sizing: border-box;
          font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, sans-serif;
          transition: background-color 0.2s ease, color 0.2s ease;
        }
        [data-theme="dark"] #pwa-boot-screen {
          background-color: #0c0d10;
          color: #ffffff;
        }
        [data-theme="light"] #pwa-boot-screen {
          background-color: #f8fafc;
          color: #0f172a;
        }

        .boot-logo-container {
          width: 84px;
          height: 84px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 22px;
          animation: bootLogoPulse 2.8s ease-in-out infinite;
        }

        @keyframes bootLogoPulse {
          0%, 100% { transform: translateY(0) scale(1); }
          50% { transform: translateY(-4px) scale(1.03); }
        }

        .boot-title {
          font-size: 1.28rem;
          font-weight: 700;
          letter-spacing: -0.025em;
          margin-bottom: 6px;
        }
        [data-theme="dark"] .boot-title {
          color: #ffffff;
        }
        [data-theme="light"] .boot-title {
          color: #0f172a;
        }

        .boot-subtitle {
          font-size: 0.86rem;
          font-weight: 500;
          margin-bottom: 24px;
        }
        [data-theme="dark"] .boot-subtitle {
          color: #94a3b8;
        }
        [data-theme="light"] .boot-subtitle {
          color: #64748b;
        }

        .boot-progress-track {
          width: 140px;
          height: 4px;
          border-radius: 9999px;
          overflow: hidden;
          position: relative;
        }
        [data-theme="dark"] .boot-progress-track {
          background: rgba(255, 255, 255, 0.1);
        }
        [data-theme="light"] .boot-progress-track {
          background: rgba(15, 23, 42, 0.08);
        }

        .boot-progress-indicator {
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          width: 45%;
          border-radius: 9999px;
          background: linear-gradient(90deg, #10b981 0%, #34d399 50%, #10b981 100%);
          box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
          animation: bootProgressSlide 1.5s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }

        @keyframes bootProgressSlide {
          0% { transform: translateX(-120%); }
          100% { transform: translateX(260%); }
        }

        #pwa-timeout-card {
          display: none;
          max-width: 320px;
          border-radius: 20px;
          padding: 18px;
          margin-top: 32px;
          backdrop-filter: blur(24px);
          -webkit-backdrop-filter: blur(24px);
        }
        [data-theme="dark"] #pwa-timeout-card {
          background: rgba(255, 255, 255, 0.06);
          border: 1px solid rgba(255, 255, 255, 0.12);
          box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        }
        [data-theme="light"] #pwa-timeout-card {
          background: rgba(255, 255, 255, 0.92);
          border: 1px solid rgba(0, 0, 0, 0.08);
          box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08);
        }

        .pwa-timeout-title {
          font-size: 0.88rem;
          font-weight: 600;
          margin-bottom: 6px;
        }
        [data-theme="dark"] .pwa-timeout-title { color: #e2e8f0; }
        [data-theme="light"] .pwa-timeout-title { color: #0f172a; }

        .pwa-timeout-desc {
          font-size: 0.78rem;
          margin-bottom: 14px;
          line-height: 1.4;
        }
        [data-theme="dark"] .pwa-timeout-desc { color: #94a3b8; }
        [data-theme="light"] .pwa-timeout-desc { color: #64748b; }

        .pwa-timeout-btn {
          background: linear-gradient(135deg, #10b981 0%, #059669 100%);
          color: #ffffff;
          border: none;
          border-radius: 12px;
          padding: 11px 20px;
          font-weight: 700;
          font-size: 0.85rem;
          cursor: pointer;
          width: 100%;
          box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }
      </style>
      <script>
        setTimeout(function() {
          var el = document.getElementById('pwa-timeout-card');
          if (el && document.getElementById('pwa-boot-screen')) {
            el.style.display = 'block';
          }
        }, 3500);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
