<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient for Squircle App Icon -->
    <linearGradient id="favBgGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#1c212e"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>

    <!-- 'P' Enclosure Gradient -->
    <linearGradient id="favPBodyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2a3244"/>
      <stop offset="60%" stop-color="#161924"/>
      <stop offset="100%" stop-color="#0f1118"/>
    </linearGradient>

    <!-- Emerald Jade Accent Gradient -->
    <linearGradient id="favJadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- 3D Curl Gradient -->
    <linearGradient id="favCurlGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <filter id="favCurlShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <filter id="favIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Apple Squircle Frame -->
  <rect width="512" height="512" rx="124" fill="url(#favBgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="122" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Logo Mark Center -->
  <g transform="translate(0, 0)">
    <!-- Outer 'P' Letter Frame -->
    <path
      d="M 160 416 C 114 416 88 390 88 344 L 88 168 C 88 96 136 56 220 56 L 320 56 C 408 56 456 104 456 192 L 456 244 C 456 332 408 380 320 380 L 264 380 C 258 380 252 384 250 390 C 244 406 236 416 216 416 Z"
      fill="url(#favPBodyGrad)"
    />

    <!-- Inner White Paper Document -->
    <path
      d="M 160 416 L 160 178 C 160 138 184 114 224 114 L 324 114 C 348 114 366 132 366 156 L 366 266 C 366 278 358 296 344 314 L 254 410 C 248 416 238 416 230 416 Z"
      fill="#FFFFFF"
    />

    <!-- Text Lines on Document -->
    <rect x="200" y="192" width="112" height="22" rx="11" fill="#1b1e26"/>
    <rect x="200" y="234" width="62" height="22" rx="11" fill="url(#favJadeGrad)" filter="url(#favIconGlow)"/>

    <!-- Folded Corner (Curl / Peel) -->
    <path
      d="M 366 266 C 366 312 338 350 286 372 C 264 382 246 398 234 416 C 248 382 278 350 316 332 C 346 320 362 296 366 266 Z"
      fill="url(#favCurlGrad)"
      filter="url(#favCurlShadow)"
    />
  </g>
</svg>