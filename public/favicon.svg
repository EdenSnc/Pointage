<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151b2a"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Apple-Style Squircle Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="118" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Minimalist Geometric Warehouse Crate (2D Isometric) -->
  <g transform="translate(256, 260)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Face -->
    <path d="M0 -124 L114 -60 L0 4 L-114 -60 Z" fill="rgba(37, 99, 235, 0.18)" stroke="url(#strokeGrad)" stroke-width="16"/>
    <!-- Left Face -->
    <path d="M-114 -60 L0 4 L0 128 L-114 64 Z" fill="rgba(37, 99, 235, 0.08)" stroke="url(#strokeGrad)" stroke-width="16"/>
    <!-- Right Face -->
    <path d="M0 4 L114 -60 L114 64 L0 128 Z" fill="rgba(37, 99, 235, 0.13)" stroke="url(#strokeGrad)" stroke-width="16"/>

    <!-- Seam line on top fold -->
    <path d="M-57 -92 L57 -28" stroke="rgba(96, 165, 250, 0.7)" stroke-width="10" stroke-dasharray="14 10"/>

    <!-- Precision Validation Checkmark -->
    <path d="M-46 15 L-12 50 L78 -40" stroke="url(#checkGrad)" stroke-width="22" filter="url(#glow)"/>
  </g>
</svg>